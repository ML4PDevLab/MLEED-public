name: Validate public data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate country-month data
        run: python scripts/build_overview.py --validate-only

      - name: Verify classifier evaluation aggregates
        run: python scripts/verify_evaluation.py --check

      - name: Check corruption detection and reusable export
        run: python scripts/test_validation.py

      - name: Verify recovered surge comparison on the frozen panel
        run: python scripts/reproduce_surges.py --check

      - name: Verify deposited file checksums
        run: python scripts/build_manifest.py --check
